<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracera Web Spike — ORT-Web (WebGPU / WASM)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
        padding: 20px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        background: #1e293b;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 14px;
      }
      label {
        font-size: 13px;
        color: #94a3b8;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      select, input, button {
        background: #0f172a;
        color: #f8fafc;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 14px;
      }
      button {
        background: #0284c7;
        border-color: #0ea5e9;
        cursor: pointer;
        font-weight: 600;
      }
      .badge {
        background: #0369a1;
        color: #e0f2fe;
        padding: 4px 10px;
        border-radius: 999px;
        font-family: monospace;
        font-size: 13px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 16px;
      }
      canvas {
        width: 100%;
        height: auto;
        background: #020617;
        border-radius: 8px;
        border: 1px solid #334155;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        font-family: monospace;
      }
      th, td {
        border-bottom: 1px solid #334155;
        padding: 6px 8px;
        text-align: left;
      }
      pre {
        background: #020617;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 10px;
        max-height: 360px;
        overflow: auto;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Tracera Tarayıcı Çıkarım Fizibilite Testi (ORT-Web)</h2>
    <div class="bar">
      <label>
        Backend
        <select id="backendSelect">
          <option value="auto" selected>Otomatik (WebGPU → WASM)</option>
          <option value="webgpu">WebGPU zorla</option>
          <option value="wasm">WASM zorla</option>
        </select>
      </label>
      <label>
        Model
        <select id="modelSelect">
          <option value="fp32" selected>FP32 (tracera_1024.onnx)</option>
          <option value="int8">INT8 Dynamic (tracera_1024_int8.onnx)</option>
        </select>
      </label>
      <label>
        Val Örneği
        <select id="sampleSelect"></select>
      </label>
      <label>
        veya Dosya Seç
        <input id="fileInput" type="file" accept="image/*" />
      </label>
      <label>
        Conf Eşiği
        <input id="confInput" type="number" step="0.005" min="0.05" max="1" value="0.395" style="width: 80px" />
      </label>
      <button id="runBtn" type="button">Çalıştır</button>
      <span class="badge" id="activeBackend">yükleniyor...</span>
    </div>
    <div id="status" style="margin-bottom: 12px; font-family: monospace;">Başlatılıyor...</div>
    <div class="grid">
      <div>
        <canvas id="previewCanvas"></canvas>
      </div>
      <div>
        <table>
          <thead>
            <tr><th>#</th><th>Sınıf</th><th>Güven</th><th>Kutu [x1,y1,x2,y2]</th></tr>
          </thead>
          <tbody id="detTableBody"></tbody>
        </table>
        <h4>DetectResult JSON</h4>
        <pre id="jsonOut"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
