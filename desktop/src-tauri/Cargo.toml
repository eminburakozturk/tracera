[package]
name = "tracera-desktop"
version = "1.1.0"
description = "Tracera PCB Hata Tespiti masaustu uygulamasi"
authors = ["Tracera"]
edition = "2021"

[lib]
name = "tracera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
